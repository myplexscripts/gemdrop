name: Trim main loop tail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trim-main-loop.yml'

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Trim final second from main loop
        shell: bash
        run: |
          set -euo pipefail
          input="assets/audio/main-loop.ogg"
          tmp="assets/audio/main-loop.trimmed.ogg"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$input")"
          trimmed="$(python3 - "$duration" <<'PY'
import sys
duration=float(sys.argv[1])
print(f"{max(0.1, duration-1.0):.6f}")
PY
)"
          echo "Original duration: $duration"
          echo "Trimmed duration:  $trimmed"
          ffmpeg -y -i "$input" -t "$trimmed" -c:a libvorbis -q:a 7 "$tmp"
          mv "$tmp" "$input"

      - name: Commit trimmed loop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/main-loop.ogg
          if git diff --cached --quiet; then
            echo "No audio change to commit."
            exit 0
          fi
          git commit -m "Trim main loop tail for smoother looping"
          git push
