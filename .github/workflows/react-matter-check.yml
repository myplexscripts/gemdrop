name: React Matter migration check

concurrency:
  group: react-matter-migration
  cancel-in-progress: true

on:
  push:
    branches:
      - react-matter-migration
    paths:
      - 'app/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/react-matter-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare runtime assets for smoke test
        run: |
          cp -R assets dist/assets
          cp -R gems dist/gems
          cp manifest.webmanifest dist/manifest.webmanifest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test production build
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gemdrop-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node app/tests/smoke.mjs

      - name: Stage production build
        shell: bash
        run: |
          set -euo pipefail
          cp dist/index.html index.html
          rm -rf build
          cp -R dist/build build

      - name: Commit verified production build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build
          if git diff --cached --quiet; then
            echo "Production build already current."
            exit 0
          fi
          git commit -m "Build verified React Matter app"
          git push
