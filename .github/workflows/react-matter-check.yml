name: React Matter migration check

on:
  push:
    branches:
      - react-matter-migration
    paths:
      - 'app/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/react-matter-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Stage production build
        shell: bash
        run: |
          set -euo pipefail
          cp dist/index.html index.html
          rm -rf build
          cp -R dist/build build

      - name: Commit verified production build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build
          if git diff --cached --quiet; then
            echo "Production build already current."
            exit 0
          fi
          git commit -m "Build verified React Matter app"
          git push
